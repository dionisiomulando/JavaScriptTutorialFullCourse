<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios Função-Parametro</title>
</head>
<body>
    <p>Pedra Papel e Tesoura</p>

    <button onclick="
        jogoPPT('Pedra');
    ">Pedra</button>

    <button onclick="
        jogoPPT('Papel');
    ">Papel</button>

    <button onclick="
        jogoPPT('Tesoura');
    ">
        Tesoura
    </button>

    <script>
        //Pedra Papel e Tesoura em função
        //melhor pratica, colocar as variaveis dentro
        function jogoPPT(ppt){
            const resultado = PedraPapelTesoura();
            if(ppt === 'Tesoura'){
                if (resultado === 'Pedra') {
                    resposta = 'Perdeu';
                } else if(resultado === 'Papel'){
                    resposta = 'Ganhou';
                } else{
                    resposta = 'Empatou';
                }

            } else if(ppt === 'Papel'){
                 if (resultado === 'Pedra') {
                        resposta = 'Ganhou';
                    } else if(resultado === 'Papel'){
                        resposta = 'Empatou';
                    } else{
                        resposta = 'Perdeu';
                }
                
            } else {
                if (resultado === 'Pedra') {
                    resposta = 'Empatou';
                } else if(resultado === 'Papel'){
                    resposta = 'Perdeu';
                } else if(resultado === 'Tesoura'){
                    resposta = 'Ganhou'
                }
            }
                console.log(`Você escolheu ${ppt}, O PC escolher ${resultado}, você ${resposta}`);  
        }
        function PedraPapelTesoura() {
            let resultado = '';
            numAleatorio = Math.random();

            if (numAleatorio >= 0 && numAleatorio < 1/3) {
                resultado = 'Pedra';
            } else if (numAleatorio >= 1/3 && numAleatorio < 2/3 ){
                resultado = 'Papel';
            } else if (numAleatorio >= 2/3 && numAleatorio < 1){
                resultado = 'Tesoura';
            }
            return resultado;
        }
    </script>
</body>
</html>
