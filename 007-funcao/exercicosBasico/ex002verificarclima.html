<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar o Clima - JS</title>
</head>
<body>
    <script>
        function verificarClima(clima) {
            if (clima > 25){
                return 'Está Calor';
            } else {
                return 'Está frio';
            }
        }
        let verClima = verificarClima(10);
        console.log(verClima)
        console.log(verificarClima())
    </script>
</body>
</html>
