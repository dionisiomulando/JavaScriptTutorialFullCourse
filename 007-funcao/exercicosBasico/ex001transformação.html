<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformação de Números - JS</title>
</head>
<body>
    <script>
        //O dobro de um número
        function dobrarNumero(num) {
            return num * 2
        }
        let resul = dobrarNumero(12)
        console.log(`O dobro é: ${resul}`);
    </script>
</body>
</html>
