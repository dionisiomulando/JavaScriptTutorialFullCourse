<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Virificador de Paridade (Par & Impar)</title>
</head>
<body>
    <script>
        function parImpar(num) {
            if (num % 2 === 0) {
                return `O ${num} é par`;
            } else {
                return `O ${num} é impar`;
            }
        }
        console.log(parImpar(7));
    </script>
</body>
</html>
