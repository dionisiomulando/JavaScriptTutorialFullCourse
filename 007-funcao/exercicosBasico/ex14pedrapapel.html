    <script>
        function resulPedraPapel(ppt) {
            let resultado = pedraPapelTesoura();
            if(ppt === 'Pedra'){
                if (resultado === 'Pedra') {
                    resposta = 'Empatou';
                } else if(resultado === 'Papel'){

                } else if(resultado === 'Tesoura'){

                }

            if(ppt === 'Papel'){
                if (resultado === 'Pedra') {

                } else if(resultado === 'Papel'){

                } else{

            }
            if(ppt === 'Tesoura'){

                }
            }
            console.log(`Você escolheu ${ppt}, O PC escolher ${resultado}, você ${resposta}`);
        }
        function pedraPapelTesoura() {
            let resultado = '';
            const numAleatorio = Math.random();
            if (numAleatorio >= 0 && numAleatorio < 1/3) {
                resultado = 'Pedra';
            } else if (numAleatorio >= 1/3 && numAleatorio < 2/3 ){
                resultado = 'Papel';
            } else if (numAleatorio >= 2/3 && numAleatorio < 1){
                resultado = 'Tesoura';
            }
            return resultado;
        }
