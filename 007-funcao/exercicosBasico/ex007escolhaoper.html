<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A escolha de Operação</title>
</head>
<body>
    <script>
        function procesNumero(valor, acao) {
            if (acao === 'dobrar') {
                return valor * 2;
            } else if (acao === 'triplicar') {
                return valor * 3    
            } else {
                return 'Ação invalida'
            }
        }
        console.log(procesNumero(6, 'tip'))
    </script>
</body>
</html>
