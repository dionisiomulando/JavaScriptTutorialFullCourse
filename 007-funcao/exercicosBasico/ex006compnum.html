<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação de Número</title>
</head>
<body>
    <script>
        function compNumero(num1, num2) {
            if (num1 > num2){
                return `O ${num1} é o maior`;
            } else if (num2 > num1) {
                return `O ${num2} é o maior`;
            } else {
                return `Os ${num1} e ${num2}, são iguais`;
            }
        }
        console.log(compNumero(7, 5))
    </script>
</body>
</html>
