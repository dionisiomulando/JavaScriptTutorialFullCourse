<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Calculador de Desconto</title>
</head>
<body>
    <script>
        function calDesconto(preco) {
            if (preco > 100) {
                return preco - (preco * 0.1);
            } else {
                return preco
            }
        }
        console.log(calDesconto(120))
    </script>
</body>
</html>
