<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Entrega - DOM</title>
</head>
<body>
    <p>Calculadora de Entrega de Iriss-Fast</p>

    <input class="js-entada-valor" onkeydown ="calEnter(event)" placeholder="Digite o Valor">

    <button onclick="
        calcularEntrega();
    ">Calcular</button>

    <p class="js-resul-entrega"></p>

    <script>
        function calEnter(event) {
            if (event.key === 'Enter') {
                calcularEntrega();
            }
        }

        function calcularEntrega() {
            let valorEntrega = document.querySelector('.js-entada-valor').value;
            let valor = Number(valorEntrega)
            if (valor < 40) {
                valor += 10;
            }
            document.querySelector('.js-resul-entrega').innerHTML = `${valor}$`;
        }
    </script>
</body>
</html>
