        let resultado = '';

            resultado = 'Pedra';

            resultado = 'Papel';
        } else if (numAleatorio >= 2/3 && numAleatorio < 1){
            resultado = 'Tesoura';
        }

        let resposta = '';

            resposta = 'Empatou';
        } else if(resultado === 'Papel'){
            resposta = 'Perdeu';
        } else if(resultado === 'Tesoura'){
            resposta = 'Ganhou'
        }

        alert(`Você escolheu Pedra, O PC escolher ${resultado}, você ${resposta}`);

    ">Pedra</button>
