<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem de Saudação</title>
</head>
<body>
    <script>
        const hora = new Date().getHours(); 
        let nome = 'Dionísio Mulando' 
        if (hora >= 6 && hora < 12) {
            console.log(`São ${hora} "Bom dia", ${nome}`)
        } else if(hora >= 12 && hora <=17 ) {
            console.log(`São ${hora} "Boa tarde", ${nome}`)
        } else if(hora >= 18 && hora <= 24){
            console.log(`São ${hora} "Boa Noite", ${nome}`)
        } else {
            console.log(`São ${hora} "Invalida", ${nome}`)
        }
    </script>
</body>
</html>
