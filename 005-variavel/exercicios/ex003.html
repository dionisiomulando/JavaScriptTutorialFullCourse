<body>
    <button type="button" onclick="console.log(`Qtd Carrinho: ${mostrarQtd}`);">Mostar Qtd</button>

    <button type="button" onclick="mostrarQtd++; 
    console.log(`Qtd Carrinho: ${mostrarQtd}`)">Add Carrinho</button>

        mostrarQtd+=2;
        console.log(`Qtd Carrinho: ${mostrarQtd}`);
    ">Adicionar +2</button>

    <button type="button" onclick="
        mostrarQtd += 3;
        console.log(`Qtd Carrinho ${mostrarQtd}`)
    ">Adicionar +3</button>

    <button type="button" onclick="
        mostrarQtd = 0;
        console.log(`Carrinho Limpo ${mostrarQtd}`)
    ">Limpar Lista</button>

        let mostrarQtd = 0;
    </script>
