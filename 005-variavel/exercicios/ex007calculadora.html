<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios Projeto Calculadora - JS</title>
</head>
<body>
    <!-- Projeto Calculadora-->
    <p>
        <button onclick="
            calcular += '1';
            console.log(`${calcular}`);
        ">1
        </button>

        <button onclick="
            calcular += '2';
            console.log(`${calcular}`);
        ">2
        </button>

        <button onclick="
            calcular += '3';
            console.log(`${calcular}`);
        ">3
        </button>
    </p>
        <button onclick="
            calcular += '4';
            console.log(`${calcular}`);
        ">4
        </button>

        <button onclick="
            calcular += '5';
            console.log(`${calcular}`);
        ">5
        </button>

        <button onclick="
            calcular += '6';
            console.log(`${calcular}`);
        ">6
        </button>
    <p>
        <button onclick="
            calcular += '7';
            console.log(`${calcular}`);
        ">7
        </button>

        <button onclick="
            calcular += '8';
            console.log(`${calcular}`);
        ">8
        </button>

        <button onclick="
            calcular += '9';
            console.log(`${calcular}`);
        ">9
        </button>
    </p>

    <p>
        <button onclick="
            calcular += '0';
            console.log(`${calcular}`);
        ">0
        </button>
        <button
            onclick="
            calcular += '+';
            console.log(`${calcular}`);
        ">
        +</button>

        <button
            onclick="
            calcular += '-';
            console.log(`${calcular}`);
        ">
        -</button>

    </p>

    <p>
        <button onclick="
            calcular = eval(calcular)
            console.log(`O resultado é: ${calcular}`)
        ">=</button>

        <button
            onclick="
            calcular += '*';
            console.log(`${calcular}`);
        ">
        *</button>

        <button
            onclick="
            calcular += '/';
            console.log(`${calcular}`);
        ">
        /</button>
    </p>

    <script>
        //Calculadora:
        let calcular = '';
    </script>
</body>
</html>
