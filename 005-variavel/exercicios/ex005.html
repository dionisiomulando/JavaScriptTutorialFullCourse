<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios Variavel 05 - JS</title>
</head>
<body>
   
    <script>

        let nome = 'Dionísio Mulando';
        console.log(`Meu nome é: ${nome}`)

        let cafe = 5;
        let bagete = 3;
        let sopa = 9;
        const custo = cafe + bagete * 2 + sopa;
        console.log(`O custo da comida é: ${custo}$`)  

        let taxa = custo * 0.1;
        console.log(`A taxa de imposto é de ${taxa}$ correspondentes a 10%`);

        let CustoTotal = custo + taxa;
        console.log(`O custo total é de: ${CustoTotal}`)

    </script>
</body>
</html>
