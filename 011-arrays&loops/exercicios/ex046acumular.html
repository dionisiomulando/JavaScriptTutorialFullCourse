        function retornarFuncao(num) {
            let novoArray = [];
            for (let i = 0; i < num.length; i++) {
                let numeroPosi = num[i]
                if (numeroPosi > 0) {
                    novoArray.push(numeroPosi)
                }
            }
            return novoArray;
        }
        console.log(retornarFuncao([-1, 2, 0, 7, 8, 20, .26, 10]));
