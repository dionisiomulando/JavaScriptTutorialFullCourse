    //Aculumador de item
    let num = [2, 3, 8, 9, 5];
    let total = 0;
    for (let i = 0; i < num.length; i++){
        total += num[i];
    }
    console.log(total)

    let numsDobrado =  [];
    total = 0;

    for(let i = 0; i < num.length; i++){
        numsDobrado.push(num[i] * 2)
        total += numsDobrado[i]    }
