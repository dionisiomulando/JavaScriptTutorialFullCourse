<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manipulacao de String</title>
</head>
<body>
  <script>
    let saudacao = 'Bom dia';
    console.log(saudacao.toLocaleUpperCase());

    console.log(saudacao.repeat(3))
  </script>
</body>
</html>
