<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        .css-botao-inscrever{
            border: none;
            background-color: #ff0000;
            color: #ffffff;
            padding: 10px;
            font-weight: bolder;
            border-radius: 20px;
            cursor: pointer;
        }
        .js-css-inscrito{
            background-color: #00ff15;
            color: #ffffff;
        }

    </style>
    <title>HTML & CSS & JAVASCRIPT</title>
</head>
<body>
    <p>Botao de se Inscrever</p>
    <button onclick="
         botaoInscrever()
    " class="js-inscrever css-botao-inscrever"> INSCREVER </button>

    <script>
        function botaoInscrever() {
            let inscreverElem = document.querySelector('.js-inscrever');
            if (inscreverElem.innerText === 'INSCREVER') {
                //usamos o innerText por causa dos espacos no botao
                inscreverElem.innerHTML = 'INSCRITO';
                inscreverElem.classList.add('js-css-inscrito')
                //adiciona uma classe em javascript para ser estilisado no css
            } else {
                inscreverElem.innerHTML = 'INSCREVER';
                inscreverElem.classList.remove('js-css-inscrito');
                //remove a class do javascript 
            }
        }
    </script>
    </script>
</body>
</html>
