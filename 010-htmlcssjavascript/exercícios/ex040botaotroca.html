<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .js-botoes{
            border: none;
            background-color: black;
            color: beige;
            padding: 10px;
            margin: 10px;
            border-radius: 20px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bolder;
        }
        .css-botoes{
            background-color: bisque;
            color: black;
        }
    </style>
    <title>Três Botões ON / OFF</title>
</head>
<body>

    <button onclick="
        botaoJogar('.js-bt-jogar')
    " class="js-botoes js-bt-jogar css-botoes">Jogar</button>

    <button onclick="
        botaoJogar('.js-bt-musica');
    "class="js-botoes js-bt-musica css-botoes">Música</button>

    <button onclick="
        botaoJogar('.js-bt-tech');
    "class="js-botoes js-bt-tech css-botoes">Tecnologia</button>

    <script>
        function botaoJogar(selec){
            let botoesJogar = document.querySelector(selec)
            if (!botoesJogar.classList.contains('js-botoes')) {
                botoesJogar.classList.add('css-botoes')
            } else {
                botoesJogar.classList.remove('css-botoes')
            }
        }
    </script>
</body>
</html>
